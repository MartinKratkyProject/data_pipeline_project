name: dev_to_prod

on:
    push:
        branches:
            - "main"  # Trigger on push to the prod branch (main).
    
    workflow_dispatch:  # Allow manual triggering from the Actions tab if needed.

jobs:
    build:
        runs-on: ubuntu-latest

        # Define environment variables here
        env:
            push_to_prod: "false"  # If push_to_prod = false, direct pushes to prod branch will be blocked.

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Check if this is a direct push to prod branch or merge request
              run: |
                echo "Checking if this is a merge request or direct push..."
                
                # Get the GitHub event name and ref for the current event.
                EVENT_NAME="$GITHUB_EVENT_NAME"
                REF_NAME="$GITHUB_REF"
                BASE_REF="$GITHUB_BASE_REF"

                echo "Event Name: $EVENT_NAME"
                echo "Ref: $REF_NAME"
                echo "Base Ref: $BASE_REF"

                if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
                  if [[ -n "$BASE_REF" ]]; then
                    # Merge request from another branch to main
                    echo "This is a merge commit from a PR, continuing the workflow..."
                  else
                    # Direct push to main
                    echo "Direct push to prod branch is disabled. Please use a merge from a lower-level branch (dev)."
                    exit 1
                  fi
                fi

            - name: Run the build process
              run: |
                echo "Running the deploy to prod process..."